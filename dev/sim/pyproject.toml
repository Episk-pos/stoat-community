[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stoat-activity-sim"
version = "0.1.0"
description = "Synthetic activity simulator for the Stoat dev environment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "motor>=3.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["sim"]
