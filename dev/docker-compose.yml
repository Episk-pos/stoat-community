# Censer dev stack — Docker Compose equivalent of the K8s/Tilt setup.
#
# Prerequisites (local dev build):
#   Build the backend binaries and copy them into docker/:
#     cd ../../stoat-backend && cargo build --release
#     cp target/release/revolt-{delta,bonfire,autumn,january} ../stoat-community/dev/docker/
#
# Prerequisites (pre-built images):
#   ./scripts/pull-images.sh latest
#   docker compose build   # re-builds with config overlay
#
# Usage:
#   docker compose up -d              # start infra + app services
#   docker compose --profile seed up  # run seed job (creates test data)

volumes:
  mongodb-data:
  minio-data:

# Shared build config for app services: overlay Revolt config onto the base image
x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile.compose-overlay

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  redis:
    image: eqalpha/keydb
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis.conf:/redis.conf:ro
    command: ["keydb-server", "/redis.conf"]
    healthcheck:
      test: ["CMD", "keydb-cli", "-a", "redisdev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo
    ports:
      - "14717:27017"
    volumes:
      - mongodb-data:/data/db

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "14672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    ports:
      - "14025:25"
      - "14080:8080"
    environment:
      MAILDEV_SMTP_PORT: "25"
      MAILDEV_WEB_PORT: "8080"
      MAILDEV_INCOMING_USER: smtp
      MAILDEV_INCOMING_PASS: smtp

  minio:
    image: minio/minio
    command: ["minio", "server", "/data"]
    ports:
      - "14009:9000"
      - "14001:9001"
    environment:
      MINIO_ROOT_USER: minioautumn
      MINIO_ROOT_PASSWORD: minioautumn
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set censer http://minio:9000 minioautumn minioautumn &&
        mc mb --ignore-existing censer/revolt-uploads
    restart: "no"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  delta:
    build:
      <<: *app-build
      args:
        BASE_IMAGE: censer-delta:dev
    ports:
      - "14702:14702"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  bonfire:
    build:
      <<: *app-build
      args:
        BASE_IMAGE: censer-bonfire:dev
    ports:
      - "14703:14703"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  autumn:
    build:
      <<: *app-build
      args:
        BASE_IMAGE: censer-autumn:dev
    ports:
      - "14704:14704"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  january:
    build:
      <<: *app-build
      args:
        BASE_IMAGE: censer-january:dev
    ports:
      - "14705:14705"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Postern (discord-stoat-sync) — Optional migration/sync service
  # ---------------------------------------------------------------------------
  postern:
    build:
      context: ../../discord-stoat-sync
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://stoatsync:stoatsync@postgres:5432/discord_stoat_sync
      CENSER_API_URL: http://delta:14702
      CENSER_BASE_URL: http://localhost:5173
      UNVEIL_API_URL: http://unveil:4000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      delta:
        condition: service_started
    profiles:
      - postern

  # ---------------------------------------------------------------------------
  # Unveil (knowledge-browser) — Optional knowledge archive service
  # ---------------------------------------------------------------------------
  unveil:
    build:
      context: ../../knowledge-browser
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://unveil:unveil@postgres:5432/unveil_dev
      SECRET_KEY_BASE: "${UNVEIL_SECRET_KEY_BASE:-dev-secret-change-in-production-12345678901234567890123456789012}"
      PHX_HOST: localhost
      CENSER_MONGO_URL: mongodb://mongodb:27017/stoat
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    profiles:
      - unveil

  # ---------------------------------------------------------------------------
  # Seed — only runs with: docker compose --profile seed up
  # ---------------------------------------------------------------------------
  seed:
    image: censer-seed:dev
    build:
      context: ./seed
      dockerfile: ../docker/Dockerfile.seed
    environment:
      DELTA_URL: http://delta:14702
      MONGO_URI: mongodb://mongodb:27017
    depends_on:
      delta:
        condition: service_started
    restart: "no"
    profiles:
      - seed
