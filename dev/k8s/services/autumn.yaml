apiVersion: apps/v1
kind: Deployment
metadata:
  name: autumn
  namespace: censer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autumn
  template:
    metadata:
      labels:
        app: autumn
    spec:
      containers:
        - name: autumn
          image: censer-autumn:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 14704
          volumeMounts:
            - name: config
              mountPath: /home/rust/src/Revolt.overrides.toml
              subPath: Revolt.overrides.toml
      volumes:
        - name: config
          configMap:
            name: censer-config
---
apiVersion: v1
kind: Service
metadata:
  name: autumn
  namespace: censer
spec:
  type: NodePort
  selector:
    app: autumn
  ports:
    - port: 14704
      targetPort: 14704
      nodePort: 30704
