apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: censer
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: censer-seed:dev
          imagePullPolicy: Never
          env:
            - name: DELTA_URL
              value: "http://delta.censer.svc:14702"
            - name: MONGO_URI
              value: "mongodb://mongodb.censer.svc:27017"
