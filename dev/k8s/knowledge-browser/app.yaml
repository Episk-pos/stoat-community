apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-browser
  namespace: stoat
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-browser
  template:
    metadata:
      labels:
        app: knowledge-browser
    spec:
      containers:
        - name: knowledge-browser
          image: kb-app
          ports:
            - containerPort: 4000
          env:
            - name: MIX_ENV
              value: "dev"
            - name: PHX_SERVER
              value: "true"
            - name: PHX_HOST
              value: "localhost"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              value: "ecto://knowledge_browser:dev_password@kb-postgres:5432/knowledge_browser_dev"
            - name: SECRET_KEY_BASE
              value: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
            - name: STOAT_MONGO_URL
              value: "mongodb://mongodb:27017"
            - name: AUTUMN_BASE_URL
              value: "http://autumn:14704"
            - name: JANUARY_BASE_URL
              value: "http://january:14705"
            - name: POOL_SIZE
              value: "10"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-browser
  namespace: stoat
spec:
  type: ClusterIP
  selector:
    app: knowledge-browser
  ports:
    - port: 4000
      targetPort: 4000
