apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-postgres
  namespace: stoat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-postgres
  template:
    metadata:
      labels:
        app: kb-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: knowledge_browser
            - name: POSTGRES_PASSWORD
              value: dev_password
            - name: POSTGRES_DB
              value: knowledge_browser_dev
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - knowledge_browser
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - knowledge_browser
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-data
          hostPath:
            path: /var/tmp/kb-postgres-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kb-postgres
  namespace: stoat
spec:
  type: ClusterIP
  selector:
    app: kb-postgres
  ports:
    - port: 5432
      targetPort: 5432
